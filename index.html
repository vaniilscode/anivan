<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVan - Каталог Аниме</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #16161e;
            --accent: #f5f5dc;
            --text-main: #ffffff;
            --text-muted: #aaa;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Arial', sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }
        .search-box input {
            padding: 10px 20px;
            width: 300px;
            border: 1px solid #333;
            border-radius: 20px;
            background-color: var(--bg-color);
            color: #fff;
            outline: none;
        }
        .catalog-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }
        .anime-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        .anime-card:hover {
            transform: translateY(-5px);
        }
        .anime-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        .card-info {
            padding: 15px;
        }
        .card-title {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: var(--text-main);
        }
        .card-genres {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: var(--text-muted);
        }
        .watch-btn {
            display: block;
            text-align: center;
            background-color: var(--accent);
            color: #000;
            padding: 10px 0;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .watch-btn:hover {
            background-color: #e6e6c8;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">AniVan</a>
        <div class="search-box">
            <input type="text" placeholder="Поиск аниме..." oninput="filterAnimes(this.value)">
        </div>
    </header>

    <div class="catalog-container">
        <div class="grid" id="catalog">
            <!-- Сюда JavaScript вставит карточки -->
        </div>
    </div>

    <script>
        // База данных с реальными Shikimori ID для точного плеера
        const animes = [
            { id: "48413", title: "Эта фарфоровая кукла влюбилась", genres: "Романтика, Школа", image: "images/porcelain-doll.jpg" },
            { id: "19815", title: "Токийский Гуль", genres: "Ужасы, Драма", image: "images/tokyo-ghoul.jpg" },
            { id: "16498", title: "Атака титанов", genres: "Экшен, Драма", image: "images/attack-on-titan.jpg" },
            { id: "20", title: "Наруто Ураганные Хроники", genres: "Приключения, Экшен", image: "images/naruto.jpg" }
        ];

        function filterAnimes(query) {
            const container = document.getElementById('catalog');
            if (!container) return;

            const searchTerm = query.toLowerCase().trim();
            let htmlContent = '';

            animes.forEach(function(anime) {
                if (anime.title.toLowerCase().includes(searchTerm)) {
                    htmlContent += '<div class="anime-card">';
                    htmlContent += '<img src="' + anime.image + '" alt="' + anime.title + '" onerror="this.src=\'https://placeholder.com\'">';
                    htmlContent += '<div class="card-info">';
                    htmlContent += '<h3 class="card-title">' + anime.title + '</h3>';
                    htmlContent += '<p class="card-genres">' + anime.genres + '</p>';
                    // Передаем в ссылку и название (t), и уникальный ID аниме (id)
                    htmlContent += '<a href="watch.html?t=' + encodeURIComponent(anime.title) + '&id=' + anime.id + '" class="watch-btn">Смотреть</a>';
                    htmlContent += '</div>';
                    htmlContent += '</div>';
                }
            });

            if (htmlContent === '') {
                container.innerHTML = '<p style="color:#aaa; text-align:center; width:100%;">Ничего не найдено 😔</p>';
            } else {
                container.innerHTML = htmlContent;
            }
        }

        window.addEventListener('load', function() {
            filterAnimes('');
        });
    </script>
</body>
</html>
